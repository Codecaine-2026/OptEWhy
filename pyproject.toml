[project]
name = "optewhy"
version = "0.1.0"
description = "AI-driven causal reasoning and scenario simulation platform for port operations."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "numpy>=1.26.0",
  "networkx>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = [
  "apps/api/tests",
  "packages/causal-engine/tests",
  "packages/rag-engine/tests",
  "packages/llm-orchestrator/tests",
  "packages/shared-domain/tests",
  "packages/data-connectors/tests",
]
pythonpath = [
  "apps/api/src",
  "packages/causal-engine/src",
  "packages/rag-engine/src",
  "packages/llm-orchestrator/src",
  "packages/shared-domain/src",
  "packages/data-connectors/src",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
